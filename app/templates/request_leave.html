{% extends "base.html" %}
{% block title %}Request Leave - Leave Management{% endblock %}
{% block content %}
<h1>Request Leave</h1>
<div class="card">
    <form method="POST" action="{{ url_for('main.request_leave') }}" id="leave-form">
        <div class="form-group">
            <label for="leave_type">Leave Type</label>
            <select id="leave_type" name="leave_type" required>
                <option value="">-- Select --</option>
                {% for lt in leave_types %}
                <option value="{{ lt }}">{{ lt }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="start_date">Start Date</label>
            <input type="date" id="start_date" name="start_date" required>
        </div>
        <div class="form-group">
            <label for="end_date">End Date</label>
            <input type="date" id="end_date" name="end_date" required>
        </div>
        <div class="form-group">
            <label for="reason">Reason</label>
            <textarea id="reason" name="reason" rows="3" placeholder="Optional reason"></textarea>
        </div>
        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" id="has_document" name="has_document">
                I have a supporting document
            </label>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-leave">Submit Request</button>
    </form>
</div>
{% endblock %}
